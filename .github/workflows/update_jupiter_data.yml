name: Update Jupiter Data

on:
  schedule:
    - cron: '0 */3 * * *'  # Кожні 3 години
  workflow_dispatch:       # Ручний запуск

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml  # Додано lxml для стабільності

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add jupiter_state.json
          git commit -m 'Auto-update Jupiter data' || echo "No changes"
          git push
