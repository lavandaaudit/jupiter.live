<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

let W, H;
let stars = [];

let density = 300;
let speed = 1.2;
let chaos = 0;
let windX = 0;
let windY = 0;
let hue = 200;

let ibo = false;
let grav = false;
let audioOn = false;

let gravityCenters = [];
let audioAmp = 0;

function resize() {
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
  createStars();
}
window.addEventListener('resize', resize);

function createStars() {
  stars = [];
  for (let i = 0; i < density; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: Math.random() * W,
      a: Math.random() * Math.PI * 2,
      px: 0,
      py: 0
    });
  }
}
resize();

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = `hsl(${hue},100%,70%)`;
  ctx.fillStyle = `hsl(${hue},100%,70%)`;

  for (let s of stars) {
    s.px = s.x;
    s.py = s.y;

    s.z -= speed + audioAmp * 0.03;
    if (s.z <= 0) {
      s.z = W;
      s.x = Math.random() * W;
      s.y = Math.random() * H;
      continue;
    }

    if (ibo) {
      s.a += 0.002;
      s.x += Math.cos(s.a) * 0.4;
      s.y += Math.sin(s.a) * 0.4;
    }

    if (grav) {
      for (let g of gravityCenters) {
        let dx = g.x - s.x;
        let dy = g.y - s.y;
        let d = Math.sqrt(dx * dx + dy * dy) + 40;
        s.x += dx / d * 0.4;
        s.y += dy / d * 0.4;
      }
    }

    s.x += windX + (Math.random() - 0.5) * chaos;
    s.y += windY + (Math.random() - 0.5) * chaos;

    const k = 300 / s.z;

    const x1 = (s.px - W / 2) * k + W / 2;
    const y1 = (s.py - H / 2) * k + H / 2;
    const x2 = (s.x  - W / 2) * k + W / 2;
    const y2 = (s.y  - H / 2) * k + H / 2;

    const dx = x2 - x1;
    const dy = y2 - y1;

    if (Math.abs(dx) + Math.abs(dy) > 0.3) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineWidth = (1 - s.z / W) * 2.5;
      ctx.stroke();
    } else {
      ctx.fillRect(x2, y2, 1.2, 1.2);
    }
  }

  requestAnimationFrame(draw);
}

draw();

/* UI */
hue.oninput = e => hue = +e.target.value;
density.oninput = e => { density = +e.target.value; createStars(); };
speed.oninput = e => speed = +e.target.value;
chaos.oninput = e => chaos = +e.target.value;
windx.oninput = e => windX = +e.target.value;
windy.oninput = e => windY = +e.target.value;

ibo.onclick = () => ibo = !ibo;

grav.onclick = () => {
  grav = !grav;
  gravityCenters = [
    { x: W * 0.3, y: H * 0.4 },
    { x: W * 0.7, y: H * 0.6 }
  ];
};

/* AUDIO */
audio.onclick = async () => {
  if (audioOn) return;
  audioOn = true;

  const A = new AudioContext();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const src = A.createMediaStreamSource(stream);
  const analyser = A.createAnalyser();

  src.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);

  function audioLoop() {
    analyser.getByteFrequencyData(data);
    audioAmp = data.reduce((a, b) => a + b, 0) / data.length;
    requestAnimationFrame(audioLoop);
  }
  audioLoop();
};
</script>
