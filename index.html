<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBONARIUM · STARFIELD LAB</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;overflow:hidden;
  font-family:system-ui,monospace;
}
canvas{position:fixed;inset:0}

.panel{
  position:fixed;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  width:180px;
  background:rgba(10,15,25,.6);
  backdrop-filter:blur(10px);
  border:1px solid rgba(120,200,255,.25);
  padding:14px;
  z-index:10;
}
.panel label{
  font-size:10px;
  letter-spacing:.2em;
  color:#cfefff;
}
.panel input{
  width:100%;
  margin:6px 0 12px;
}
button{
  width:100%;
  padding:8px;
  margin-top:6px;
  background:rgba(60,140,220,.25);
  border:1px solid rgba(120,200,255,.3);
  color:#cfefff;
  cursor:pointer;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="panel">
  <label>COLOR</label>
  <input type="range" min="0" max="360" value="200" id="hue">

  <label>DENSITY</label>
  <input type="range" min="100" max="1000" value="300" id="density">

  <label>SPEED</label>
  <input type="range" min="0.2" max="3" step="0.1" value="1.2" id="speed">

  <label>CHAOS</label>
  <input type="range" min="0" max="20" value="0" id="chaos">

  <label>WIND X</label>
  <input type="range" min="-5" max="5" step="0.1" value="0" id="windx">

  <label>WIND Y</label>
  <input type="range" min="-5" max="5" step="0.1" value="0" id="windy">

  <button id="ibo">IBONARIUM MODE</button>
  <button id="grav">GRAVITY</button>
  <button id="audio">AUDIO REACT</button>
</div>

<script>
const c=document.getElementById('c'),x=c.getContext('2d')
let W,H,stars=[]
let density=300,speed=1.2,chaos=0,windX=0,windY=0,hue=200
let ibo=false,grav=false,audioOn=false
let gravityCenters=[]
let audioAmp=0

function resize(){
  W=c.width=innerWidth
  H=c.height=innerHeight
  createStars()
}
addEventListener('resize',resize)

function createStars(){
  stars=[]
  for(let i=0;i<density;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      z:Math.random()*W,
      a:Math.random()*Math.PI*2
    })
  }
}
resize()

function draw(){
  x.fillStyle='rgba(0,0,0,0.08)'
  x.fillRect(0,0,W,H)
  x.strokeStyle=`hsl(${hue},100%,70%)`

  for(let s of stars){
    s.z-=speed+audioAmp*0.05
    if(s.z<=0){s.z=W;s.x=Math.random()*W;s.y=Math.random()*H}

    let k=300/s.z
    let px=(s.x-W/2)*k+W/2
    let py=(s.y-H/2)*k+H/2

    if(ibo){
      s.a+=0.002
      s.x+=Math.cos(s.a)*0.5
      s.y+=Math.sin(s.a)*0.5
    }

    if(grav){
      for(let g of gravityCenters){
        let dx=g.x-s.x,dy=g.y-s.y
        let d=Math.sqrt(dx*dx+dy*dy)+20
        s.x+=dx/d*0.3
        s.y+=dy/d*0.3
      }
    }

    s.x+=windX+(Math.random()-.5)*chaos
    s.y+=windY+(Math.random()-.5)*chaos

    let nx=(s.x-W/2)*k+W/2
    let ny=(s.y-H/2)*k+H/2

    x.beginPath()
    x.moveTo(px,py)
    x.lineTo(nx,ny)
    x.lineWidth=(1-s.z/W)*3
    x.stroke()
  }
  requestAnimationFrame(draw)
}
draw()

/* UI */
hue.oninput=e=>hue=e.target.value
density.oninput=e=>{density=e.target.value;createStars()}
speed.oninput=e=>speed=e.target.value
chaos.oninput=e=>chaos=e.target.value
windx.oninput=e=>windX=+e.target.value
windy.oninput=e=>windY=+e.target.value

ibo.onclick=()=>ibo=!ibo
grav.onclick=()=>{
  grav=!grav
  gravityCenters=[
    {x:W*.3,y:H*.4},
    {x:W*.7,y:H*.6}
  ]
}

/* AUDIO */
audio.onclick=async()=>{
  if(audioOn)return
  audioOn=true
  const ctxA=new AudioContext()
  const mic=await navigator.mediaDevices.getUserMedia({audio:true})
  const src=ctxA.createMediaStreamSource(mic)
  const analyser=ctxA.createAnalyser()
  src.connect(analyser)
  const data=new Uint8Array(analyser.frequencyBinCount)
  function audioLoop(){
    analyser.getByteFrequencyData(data)
    audioAmp=data.reduce((a,b)=>a+b,0)/data.length
    requestAnimationFrame(audioLoop)
  }
  audioLoop()
}
</script>

</body>
</html>
