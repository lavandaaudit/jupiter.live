<!-- index.html (for GitHub Pages) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUPITER LIVE: THE KING MONITOR</title>
    <style>
        body { font-family: Arial, sans-serif; background: #000; color: #fff; }
        #visual-center { text-align: center; }
        #dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        canvas { border: 1px solid #fff; }
    </style>
    <!-- CDN for libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.20/astronomy.min.js"></script>
</head>
<body>
    <h1>JUPITER LIVE: THE KING MONITOR</h1>
    
    <!-- 1. Visual Center -->
    <section id="visual-center">
        <h2>Juno’s View</h2>
        <div id="junocam-gallery"></div>
        
        <h2>3D Interactive Model</h2>
        <div id="threejs-container" style="width: 800px; height: 600px; margin: auto;"></div>
    </section>
    
    <!-- 2. Dashboard -->
    <section id="dashboard">
        <div id="radio-jove"></div>
        <div id="dsn-status"></div>
        <!-- Add more panels -->
    </section>
    
    <!-- 3. Animations -->
    <section id="animations">
        <h2>Storm Dynamics</h2>
        <div id="storm-gif"></div>
        
        <h2>Transit Predictor</h2>
        <div id="transit-info"></div>
    </section>
    
    <script>
        // Fetch data from jupiter_state.json
        async function loadData() {
            try {
                const response = await fetch('jupiter_state.json');
                return await response.json();
            } catch (e) {
                console.error('Error loading data:', e);
                return {};
            }
        }

        // Display JunoCam images
        function displayJunoCam(data) {
            const gallery = document.getElementById('junocam-gallery');
            gallery.innerHTML = '';
            data.junocam.images.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = 'JunoCam Image';
                img.style.width = '200px';
                gallery.appendChild(img);
            });
            gallery.insertAdjacentHTML('beforeend', `<p>Latest Perijove: ${data.junocam.perijove}</p>`);
        }

        // Display DSN Status
        function displayDSN(data) {
            const dsnDiv = document.getElementById('dsn-status');
            dsnDiv.innerHTML = `
                <h3>DSN Status for JUNO</h3>
                <p>Data Rate: ${data.dsn.data_rate || 'N/A'} kbps</p>
                <p>Frequency: ${data.dsn.frequency || 'N/A'}</p>
                <p>Round Trip Time: ${data.dsn.rtt || 'N/A'}</p>
            `;
        }

        // Display Radio JOVE (Plotly example)
        function displayRadioJove(data) {
            const radioDiv = document.getElementById('radio-jove');
            radioDiv.innerHTML = '<h3>Radio JOVE Monitor</h3><div id="radio-plot" style="width:300px;height:200px;"></div>';
            // Placeholder data; replace with actual from JSON
            const plotData = [{ x: [1,2,3], y: [10,15,13], type: 'scatter' }];
            Plotly.newPlot('radio-plot', plotData, { title: 'Intensity Graph' });
            radioDiv.insertAdjacentHTML('beforeend', `<p>Latest Burst: ${data.radio_jove.latest_burst}</p>`);
        }

        // 3D Model with Three.js and Astronomy Engine
        function init3D() {
            const container = document.getElementById('threejs-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Jupiter sphere
            const textureLoader = new THREE.TextureLoader();
            const jupiterTexture = textureLoader.load('https://science.nasa.gov/wp-content/uploads/2023/09/jupiter_marble_1024.jpg'); // Example texture
            const geometry = new THREE.SphereGeometry(5, 32, 32);
            const material = new THREE.MeshBasicMaterial({ map: jupiterTexture });
            const jupiter = new THREE.Mesh(geometry, material);
            scene.add(jupiter);

            // Add moons (positions from Astronomy Engine)
            const now = new Date();
            const moons = ['Io', 'Europa', 'Ganymede', 'Callisto'];
            moons.forEach(moon => {
                const pos = Astronomy.Position(moon, now); // Jovicentric position
                const moonGeo = new THREE.SphereGeometry(0.5, 16, 16);
                const moonMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const moonMesh = new THREE.Mesh(moonGeo, moonMat);
                moonMesh.position.set(pos.x / 1000000, pos.y / 1000000, pos.z / 1000000); // Scale down
                scene.add(moonMesh);
            });

            camera.position.z = 20;

            function animate() {
                requestAnimationFrame(animate);
                jupiter.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
            animate();
        }

        // Transit Predictor (example)
        function displayTransit() {
            const transitDiv = document.getElementById('transit-info');
            // Use Astronomy Engine to calculate next transit
            // Placeholder
            transitDiv.innerHTML = '<p>Next Io Transit: Calculating...</p>';
        }

        // Main init
        async function init() {
            const data = await loadData();
            displayJunoCam(data);
            displayDSN(data);
            displayRadioJove(data);
            init3D();
            displayTransit();
            // Add more: Storm GIF, etc.
            // For storm: <img src="https://www.nasa.gov/sites/default/files/thumbnails/image/juno_polar_cyclones.gif">
        }

        init();

        // Periodic refresh
        setInterval(init, 60000); // Every minute
    </script>
</body>
</html>
